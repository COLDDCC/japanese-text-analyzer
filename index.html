<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wakachi — Japanese text, word by word</title>
    <meta
      name="description"
      content="Paste Japanese text and see every word's reading, dictionary form, part of speech and English meaning. Runs entirely in your browser."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E5%88%86%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="logo" href="/">
          <span class="logo__mark">分</span>
          <span class="logo__name">Wakachi</span>
        </a>
        <div class="lang-toggle" role="group" aria-label="Interface language">
          <button type="button" class="lang-toggle__button" data-lang="zh">中</button>
          <button type="button" class="lang-toggle__button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel input-panel">
        <p class="tagline" data-i18n="tagline"></p>
        <textarea id="input" class="input" rows="5" spellcheck="false"></textarea>
        <div class="input-bar">
          <span id="char-count" class="char-count"></span>
          <div class="input-bar__actions">
            <button type="button" id="sample" class="button button--ghost" data-i18n="sample"></button>
            <button type="button" id="clear" class="button button--ghost" data-i18n="clear"></button>
            <button type="button" id="analyze" class="button button--primary" data-i18n="analyze"></button>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="progress" class="progress" hidden><div id="progress-bar" class="progress__bar"></div></div>
      </section>

      <div class="results">
        <section class="panel output-panel">
          <div id="output" class="output" aria-live="polite"></div>
          <p id="token-count" class="token-count"></p>
        </section>

        <aside id="details" class="details" aria-label="Word details">
          <div class="details__bar">
            <h2 class="details__title" data-i18n="detailsTitle"></h2>
            <button type="button" id="details-close" class="details__close" aria-label="Close">×</button>
          </div>
          <div id="details-body" class="details__body">
            <p class="details__note" data-i18n="detailsHint"></p>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer"></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
