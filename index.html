<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wakachi — Japanese text, word by word</title>
    <meta
      name="description"
      content="Paste Japanese text and see every word's reading, dictionary form, part of speech and English meaning. Runs entirely in your browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='4.5' y='4.5' width='4' height='4' fill='%234A7FB5'/%3E%3Cg stroke='%234A7FB5' stroke-width='1'%3E%3Cpath d='M4.5 0v16M8.5 0v16M12.5 0v16M0 4.5h16M0 8.5h16M0 12.5h16'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preload" href="/fonts/anybody-700.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap mast">
        <a class="brand" href="/">
          <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="4.5" y="4.5" width="4" height="4" fill="currentColor" opacity="0.9" />
            <g stroke="currentColor" stroke-width="1" fill="none">
              <path d="M4.5 0v16M8.5 0v16M12.5 0v16M0 4.5h16M0 8.5h16M0 12.5h16" />
            </g>
          </svg>
          Wakachi
        </a>
        <div class="seg lang-toggle" role="group" aria-label="Interface language">
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="heading"></h1>
        <p class="lede" data-i18n="tagline"></p>
      </section>

      <section class="block">
        <div class="block-hd">
          <span data-i18n="inputLabel"></span>
          <span id="char-count"></span>
        </div>
        <div class="block-body">
          <textarea id="input" class="input" rows="4" spellcheck="false"></textarea>
          <div class="input-bar">
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <div class="input-bar__actions">
              <button type="button" id="sample" class="btn" data-i18n="sample"></button>
              <button type="button" id="clear" class="btn" data-i18n="clear"></button>
              <button type="button" id="analyze" class="btn btn--go" data-i18n="analyze"></button>
            </div>
          </div>
          <div id="progress" class="progress" hidden>
            <div id="progress-bar" class="progress__bar"></div>
          </div>
        </div>
      </section>

      <div class="results">
        <section class="sheet-frame">
          <div id="output" class="output" aria-live="polite"></div>
          <div class="sheet-meta">
            <span id="token-count"></span>
            <span data-i18n="engine"></span>
          </div>
        </section>

        <aside id="details" class="block details" aria-label="Word details">
          <div class="block-hd">
            <span data-i18n="detailsTitle"></span>
            <button type="button" id="details-close" class="details__close" aria-label="Close">
              ×
            </button>
          </div>
          <div id="details-body" class="details__body">
            <p class="note" data-i18n="detailsHint"></p>
          </div>
        </aside>
      </div>
    </main>

    <footer>
      <div class="wrap foot">
        <span data-i18n="footer"></span>
        <span class="foot__mark">分</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
